name: Release

# Scaffolded by tools/adopt-release.sh — Conventional Commits drive release-please
# (opens a release PR that bumps the version + CHANGELOG); merging it tags, releases,
# and publishes. Shared logic lives in bamr87/.github. See release-please-config.json.

on:
  push:
    # The repo's default branch is `main` — the adopt-release.sh scaffold shipped
    # `master`, which never matched, so release-please had zero runs in history.
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: bamr87/.github/.github/workflows/release-please.yml@209e536d2b86d4a7197a1ade499b8655ebc6acc1  # bamr87/.github main 2026-10-04 (no tags yet)
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: bamr87/.github/.github/workflows/publish.yml@209e536d2b86d4a7197a1ade499b8655ebc6acc1  # bamr87/.github main 2026-10-04 (no tags yet)
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit
