name: Release

# Scaffolded by tools/adopt-release.sh — Conventional Commits drive release-please
# (opens a release PR that bumps the version + CHANGELOG); merging it tags, releases,
# and publishes. Shared logic lives in bamr87/.github. See release-please-config.json.
# The PyPI upload is the one job defined here: see the `pypi` job below.

on:
  push:
    # The repo's default branch is `main` — the adopt-release.sh scaffold shipped
    # `master`, which never matched, so release-please had zero runs in history.
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    uses: bamr87/.github/.github/workflows/release-please.yml@v1
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  publish:
    needs: release
    if: needs.release.outputs.release_created == 'true'
    uses: bamr87/.github/.github/workflows/publish.yml@v1
    with:
      tag: ${{ needs.release.outputs.tag_name }}
      version: ${{ needs.release.outputs.version }}
    permissions:
      contents: write
      packages: write
      id-token: write
    secrets: inherit

  # PyPI Trusted Publishing only accepts an OIDC token minted by a job defined in
  # this file. Inside a reusable workflow the token names the shared publish.yml,
  # and PyPI answers `invalid-publisher`, so the upload lives here. The trusted
  # publisher on pypi.org must name workflow `release.yml` and environment `pypi`
  # (docs/releasing.md).
  pypi:
    name: PyPI
    needs: release
    if: needs.release.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/fredgar-ai
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # release-please (`release-type: simple`) does not bump pyproject.toml, so
      # the tagged tree still carries an old version. Write the released one into
      # this checkout only, and stop before building if it did not take.
      - name: Set the released version in pyproject.toml
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re
          import tomllib

          version = os.environ["VERSION"]
          path = pathlib.Path("pyproject.toml")
          line = f'version = "{version}"'
          path.write_text(re.sub(r'(?m)^version = "[^"]*"$', lambda _: line, path.read_text(), count=1))
          found = tomllib.loads(path.read_text())["project"]["version"]
          if found != version:
              raise SystemExit(f"pyproject.toml project.version is {found!r}, expected {version!r}")
          PY

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
